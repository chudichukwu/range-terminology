[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "range-engine"
version = "0.1.0"
description = "Pluggable range-detection domain engine for the crypto range-trading terminal."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
exchange = [
    "ccxt>=4.0",
]
security = [
    "keyring>=24",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/range_engine", "src/signal_engine", "src/risk_engine", "src/exchange", "src/execution_engine", "src/market_data", "src/persistence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["range_engine", "signal_engine", "risk_engine", "exchange", "execution_engine", "market_data", "persistence"]
strict = true
